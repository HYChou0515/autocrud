name: Tests

# Runs on every PR (head + target branches), on direct pushes to master,
# inside a merge queue, and on demand. Make the ``required`` job(s) below
# required status checks in branch protection so PRs can't merge red.
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  merge_group:
  workflow_dispatch:

# Cancel in-flight runs for the same PR / branch when a new commit lands,
# so reviewers see only the latest result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Fast, service-free gate that runs on every PR.
  # NB: the job ID and name are what branch protection matches on — keep
  # them stable, or update protection rules when renaming.
  fast:
    name: fast (no external services)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v3
      - name: Install dependencies
        run: uv sync --extra dev

      # Public-API contract tests (fast, no external services).
      # ``-x`` stops at the first failure so the run fails fast.
      - name: Contract tests
        run: uv run pytest tests/test_docs_contract.py -q -x

      # Executable documentation: the ```python blocks in these files must run.
      # Expand the list as more pages are annotated (```python continuation / notest).
      - name: Documentation examples
        run: uv run pytest --markdown-docs README.md -q -x

      # Service-free unit + route tests, instrumented for coverage. Integration
      # tests (Postgres / S3 / MinIO / RabbitMQ) are tagged via the root
      # tests/conftest.py and excluded here; benchmarks and known-slow tests are
      # also excluded. ``coverage run`` uses [tool.coverage.run] from pyproject
      # (measures the ``specstar`` package); ``-x`` still fails fast.
      - name: Unit + route tests (no external services)
        run: uv run coverage run -m pytest -m "not integration and not benchmark and not slow" -q -x

      # Print a summary in the log and emit coverage.xml for Codecov. These run
      # only when the test step above succeeded (no ``if: always()``), so a
      # fail-fast (-x) partial run is never reported as the coverage number.
      - name: Coverage report
        run: |
          uv run coverage report
          uv run coverage xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          slug: HYChou0515/specstar
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # Single status check that fans in from every required job above.
  # Make THIS the required check in branch protection — that way adding a
  # new required job is one line here instead of a protection-rule edit.
  required:
    name: required
    if: always()
    needs: [fast]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all required jobs passed
        run: |
          if [ "${{ needs.fast.result }}" != "success" ]; then
            echo "fast job did not succeed (result: ${{ needs.fast.result }})"
            exit 1
          fi
          echo "All required jobs passed."

  # NOTE: a separate ``integration`` job (services: postgres + minio +
  # rabbitmq, ``-m integration``) is intentionally not enabled here yet.
  # When you're ready, add a sibling job using GitHub Actions ``services:``
  # to spin those up and run ``uv run pytest -m integration -q``, then add
  # it to ``needs: [fast, integration]`` on the ``required`` job above.

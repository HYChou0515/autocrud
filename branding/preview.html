<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>SpecStar Logo Preview</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 40px; background: #fafafa; }
    h2 { color: #0F172A; margin-top: 40px; border-bottom: 1px solid #e5e5e5; padding-bottom: 8px; }
    .row { display: flex; gap: 24px; flex-wrap: wrap; align-items: center; margin-bottom: 24px; }
    .card { background: white; border: 1px solid #e5e5e5; border-radius: 12px; padding: 24px; }
    .card.dark { background: #0F172A; }
    .card.dark object { filter: invert(1); }
    .size-row object { vertical-align: middle; margin-right: 16px; }
  </style>
</head>
<body>
  <h2>Wordmark</h2>
  <div class="row">
    <div class="card"><object data="logo-text.svg" type="image/svg+xml" width="320"></object></div>
    <div class="card dark"><object data="logo-text.svg" type="image/svg+xml" width="320"></object></div>
  </div>

  <h2>Mark</h2>
  <div class="row">
    <div class="card"><object data="logo-mark.svg" type="image/svg+xml" width="160"></object></div>
    <div class="card dark"><object data="logo-mark.svg" type="image/svg+xml" width="160"></object></div>
  </div>

  <h2>Mark — favicon sizes</h2>
  <div class="row size-row">
    <object data="logo-mark.svg" type="image/svg+xml" width="128"></object>
    <object data="logo-mark.svg" type="image/svg+xml" width="64"></object>
    <object data="logo-mark.svg" type="image/svg+xml" width="32"></object>
    <object data="logo-mark.svg" type="image/svg+xml" width="16"></object>
  </div>
</body>
</html>
